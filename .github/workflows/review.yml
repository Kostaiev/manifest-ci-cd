name: Code Review

on:
  workflow_run:
    workflows: ["Ansible Validate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: [self-hosted, linux, ansible-lab]

    steps:
      - name: Code Review
        run: |
          echo "Starting Code Review"

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
