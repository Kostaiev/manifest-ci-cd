name: Ansible CI

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      component:
        description: "Select component"
        required: true
        type: choice
        default: all
        options:
          - all
          - node-exporter
          - prometheus
          - grafana

permissions:
  contents: read

jobs:
  notify-start:
    uses: ./.github/workflows/notify.yml
    with:
      message: |
        🚀 Ansible pipeline started
        Event: ${{ github.event_name }}
        Commit: ${{ github.sha }}
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  detect:
    runs-on: ubuntu-24.04

    outputs:
      components: ${{ steps.select.outputs.components }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build path filters
        if: github.event_name == 'push'
        id: build
        run: |
          filters=$(jq -c '
            .components |
            with_entries(.value = .value.paths)
          ' .github/components.json)

          echo "filters=$filters" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: ${{ steps.build.outputs.filters }}

      - name: Select components
        id: select
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          COMPONENT: ${{ inputs.component }}
        run: |
          bash .github/scripts/ci-select-components.sh

  validate:
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  deploy:
    needs: [detect, validate]
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        needs.validate.result == 'success' &&
        needs.detect.outputs.components != '[]'
      }}

    uses: ./.github/workflows/deploy.yml
    with:
      components: ${{ needs.detect.outputs.components }}
    secrets: inherit

  review:
    needs: validate
    if: needs.validate.result == 'success'
    uses: ./.github/workflows/review.yml

  notify-end:
    needs: [notify-start, detect, validate, deploy, review]
    if: ${{ always() }}

    uses: ./.github/workflows/notify.yml
    with:
      message: |
        ${{ contains(needs.*.result, 'failure') &&
         '❌ Ansible pipeline FAILED' ||
          contains(needs.*.result, 'cancelled') &&
           '🚫 Ansible pipeline CANCELLED' ||
            '✅ Ansible pipeline SUCCESS' }}
        Detect: ${{ needs.detect.result }}
        Validate: ${{ needs.validate.result }}
        Deploy: ${{ needs.deploy.result }}
        Review: ${{ needs.review.result }}
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
