name: Ansible CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: [self-hosted, linux, ansible-lab]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate components.json
        run: |
          set -euo pipefail

          jq -e '
            .components as $c
            | .version == 1
              and ($c | type == "object" and length > 0)
              and all($c | to_entries[];
                (.key | test("^[a-z0-9-]+$"))
                and (.value.paths |
                  type == "array" and length > 0
                  and all(.[]; type == "string" and length > 0))
                and (.value.playbook |
                  type == "string"
                  and startswith("ansible/playbooks/")
                  and (endswith(".yml") or endswith(".yaml")))
              )
          ' .github/components.json > /dev/null

          jq -r '.components[].playbook' \
            .github/components.json |
          while IFS= read -r playbook; do
            test -f "$playbook"
          done

      - name: Build path filters
        id: build
        run: |
          filters=$(jq -c '
            .components |
            with_entries(.value = .value.paths)
          ' .github/components.json)

          echo "filters=$filters" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: ${{ steps.build.outputs.filters }}

      - name: Save plan to shared storage
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail

          jq -e 'type == "array" and all(.[]; type == "string")' \
            <<< "$CHANGED" > /dev/null

          mkdir -p /ci-state/pending

          tmp=$(mktemp /ci-state/pending/.plan.XXXXXX)
          trap 'rm -f "$tmp"' EXIT

          printf '%s\n' "$CHANGED" > "$tmp"

          mv "$tmp" \
            "/ci-state/pending/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
