name: Ansible Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, ansible-lab]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate components.json
        run: |
          bash .github/scripts/validate-components.sh

      - name: YAML lint
        working-directory: ansible
        run: |
          yamllint -c ../.yamllint .

      - name: Validate all playbooks
        working-directory: ansible

        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
         bash ../.github/scripts/validate-playbooks.sh
