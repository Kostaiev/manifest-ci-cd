name: Ansible Deploy

on:
  workflow_run:
    workflows: ["Ansible Validate"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      component:
        description: "Choose component"
        required: true
        type: choice
        default: all
        options:
          - all
          - node-exporter
          - prometheus
          - grafana

permissions:
  contents: read

concurrency:
  group: ansible-lab-deploy
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    runs-on: [self-hosted, linux, ansible-lab]

    outputs:
      components: ${{ steps.select.outputs.components }}
      sha: ${{ steps.select.outputs.sha }}

    steps:
      - name: Find validated plan
        if: github.event_name == 'workflow_run'
        id: shared
        env:
          VALIDATION_ID: ${{ github.event.workflow_run.id }}
          VALIDATION_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail

          dir="/ci-state/validated/${VALIDATION_ID}-${VALIDATION_ATTEMPT}"

          shopt -s nullglob
          dirs=("$dir"/*)

          (( ${#dirs[@]} == 1 )) && test -d "${dirs[0]}"

          sha="${dirs[0]##*/}"

          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]

          file="${dirs[0]}/${sha:0:4}-${VALIDATION_ID}-${VALIDATION_ATTEMPT}.json"

          test -s "$file"

          jq -e 'type == "array" and all(.[]; type == "string")' \
            "$file" > /dev/null

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "components=$(jq -c . "$file")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.shared.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Select components
        id: select
        env:
          AUTO: ${{ steps.shared.outputs.components }}
          MANUAL: ${{ inputs.component }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then

            if [[ "$MANUAL" == "all" ]]; then
              selected=$(jq -c '.components | keys' .github/components.json)
            else
              selected=$(jq -nc --arg id "$MANUAL" '[$id]')
            fi

          else
            selected="$AUTO"
          fi

          jq -e --argjson ids "$selected" '
            .components as $c
            | ($ids | type == "array" and all(.[];
                type == "string" and $c[.] != null))
          ' .github/components.json > /dev/null

          echo "components=$(jq -c 'unique' <<< "$selected")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    uses: ./.github/workflows/validate.yml
    secrets: inherit

  deploy:
    needs: [prepare, validate]

    if: >-
      ${{
        !cancelled() &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.components != '[]' &&
        (
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
          (github.event_name == 'workflow_dispatch' && needs.validate.result == 'success')
        )
      }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        component: ${{ fromJSON(needs.prepare.outputs.components) }}

    runs-on: [self-hosted]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Deploy component
        working-directory: ansible
        env:
          COMPONENT: ${{ matrix.component }}
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${SSH_KEY:?Missing ANSIBLE_SSH_KEY}"

          umask 077
          key=$(mktemp "$RUNNER_TEMP/ansible-key.XXXXXX")
          trap 'rm -f "$key"' EXIT

          printf '%s\n' "$SSH_KEY" > "$key"
          export ANSIBLE_PRIVATE_KEY_FILE="$key"

          playbook=$(jq -er --arg id "$COMPONENT" \
            '.components[$id].playbook' ../.github/components.json)

          ansible-playbook "${playbook#ansible/}"
