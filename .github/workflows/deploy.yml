name: Ansible Deploy

on:
  workflow_call:
    inputs:
      components:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ansible-lab-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.components) }}

    runs-on: [self-hosted, linux, ansible-lab]

    env:
          COMPONENT: ${{ matrix.component }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Notify deploy start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          MESSAGE="🚀 Deploy started: $COMPONENT"
          export MESSAGE

          bash .github/scripts/notify-telegram.sh ||
            echo "::warning::Telegram notification failed"

      - name: Deploy component
        id: deploy
        working-directory: ansible

        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}

        run: |
          bash ../.github/scripts/deplioy-component.sh

      - name: Notify deploy result
        env:
          RESULT: ${{ steps.deploy.outcome }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          if [[ "$RESULT" == "success" ]]; then
            MESSAGE="✅ Deploy successful: $COMPONENT"
          else
            MESSAGE="❌ Deploy failed: $COMPONENT"
          fi

          MESSAGE+=$'\n'
          MESSAGE+="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          export MESSAGE

          bash .github/scripts/notify-telegram.sh ||
            echo "::warning::Telegram notification failed"
