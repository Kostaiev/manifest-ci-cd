name: Ansible Deploy

on:
  workflow_call:
    inputs:
      components:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ansible-lab-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.components) }}

    runs-on: [self-hosted, linux, ansible-lab]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy component
        working-directory: ansible

        env:
          COMPONENT: ${{ matrix.component }}
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}

        run: |
          bash ../.github/scripts/deplioy-component.sh
